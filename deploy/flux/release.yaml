apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loom
  namespace: media
spec:
  interval: 10m
  timeout: 15m
  releaseName: loom
  chart:
    spec:
      chart: ./deploy/helm/loom
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: loom
        namespace: media
      interval: 30m
  values:
    image:
      # Replace with the matching published image version, WITHOUT v.
      tag: REPLACE_WITH_STABLE_VERSION
    replicaCount: 1
    rain:
      enabled: false
    persistence:
      config:
        enabled: true
        # Select a local/block CSI StorageClass with SQLite-safe locking.
        storageClass: REPLACE_WITH_SQLITE_STORAGE_CLASS
        size: 1Gi
      media:
        enabled: false
        # Before importing, enable and set existingClaim to a prepared media
        # PVC in this namespace (see docs/kubernetes.md).
    service:
      type: ClusterIP
    ingress:
      enabled: false
