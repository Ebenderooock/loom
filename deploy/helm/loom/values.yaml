# Default values for loom.

replicaCount: 1
# SQLite is single-writer: the chart enforces one replica and uses Recreate.
progressDeadlineSeconds: 900
terminationGracePeriodSeconds: 90

# Rendered into a read-only kernel config; writable UI/auth state is loom.json
# on the /config PVC. Use YAML for the DB path, not an unbound env-only key.
config:
  config_dir: /config
  data_dir: /config
  storage:
    engine: sqlite
    sqlite:
      path: /config/data/loom.db
  auth:
    mode: forms
  filesystem:
    allowed_browse_roots:
      - /media

image:
  repository: ghcr.io/ebenderooock/loom
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 1925

# Pod networking options. Enable hostNetwork for troubleshooting
# pod-network/CNI issues (for example, torrent metadata resolution).
hostNetwork: false
# Optional explicit pod DNS policy. Leave empty for automatic behavior:
# - ClusterFirst when hostNetwork=false
# - ClusterFirstWithHostNet when hostNetwork=true
dnsPolicy: ""

# ---------- Rain torrent sidecar ----------
# Loom's builtin/torrent kind now talks to a co-located Rain sidecar over
# internal JSON-RPC. No public UI/API exposure is required; auth stays in Loom.
rain:
  # Release images do not include /usr/local/bin/rain. Opt in only with a
  # separately built image containing that executable; no runtime installation.
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  rpc:
    host: 127.0.0.1
    port: 7246
    timeoutSecs: 10
  # Directory where Rain writes completed content.
  downloadDir: /media/downloads
  # Optional performance/behavior tuning written into Rain config.
  dhtEnabled: true
  pexEnabled: true
  speedLimitDownloadKBps: 0
  speedLimitUploadKBps: 0
  # Rain config + session DB location (inside config PVC).
  stateDir: /config/rain

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: loom.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

persistence:
  config:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    existingClaim: ""

  media:
    enabled: false
    mountPath: /media
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 100Gi
    existingClaim: ""

  # Optional separate download PVC. Prefer downloads under media.mountPath
  # on the SAME filesystem for hardlinks/atomic moves.
  downloads:
    enabled: false
    mountPath: /downloads
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 100Gi
    existingClaim: ""

# Extra volumes and mounts for media libraries, NFS, etc.
extraVolumes: []
extraVolumeMounts: []

# Extra environment variables
extraEnv: []
  # - name: LOOM_LOG_LEVEL
  #   value: debug

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness/readiness probes hit the built-in healthcheck endpoint.
probes:
  startup:
    enabled: true
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
