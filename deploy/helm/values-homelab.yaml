# Loom — Homelab Talos deployment values
# Usage:
#   helm install loom ./deploy/helm/loom \
#     -f deploy/helm/values-homelab.yaml \
#     -n media --create-namespace
replicaCount: 1

image:
  repository: ghcr.io/ebenderooock/loom
  pullPolicy: IfNotPresent
  tag: "0.1.0"

# ---------- Security context (match existing containers) ----------
podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# ---------- Service ----------
service:
  type: ClusterIP
  port: 9999

# ---------- Rain sidecar ----------
rain:
  enabled: false  # use an external client; release image has no Rain executable
  rpc:
    host: 127.0.0.1
    port: 7246
    timeoutSecs: 10
  downloadDir: /media/downloads
  dhtEnabled: true
  pexEnabled: true
  speedLimitDownloadKBps: 0
  speedLimitUploadKBps: 0
  stateDir: /config/rain

# ---------- Ingress (Traefik) ----------
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Uncomment for automatic TLS via cert-manager:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: loom.example.com  # <-- change to your domain
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: loom-tls
      hosts:
        - loom.example.com

# ---------- Persistence ----------
# Config/SQLite must use local or block storage, not an NFS share.
persistence:
  config:
    enabled: true
    storageClass: ""  # select a SQLite-safe local/block class before installing
    accessMode: ReadWriteOnce
    size: 1Gi
  media:
    enabled: false  # handled by existing PVCs below

# Mount existing Synology media PVCs
extraVolumes:
  - name: movies
    persistentVolumeClaim:
      claimName: movies-pvc
  - name: tv
    persistentVolumeClaim:
      claimName: tv-pvc
  - name: downloads
    persistentVolumeClaim:
      claimName: downloads-pvc

extraVolumeMounts:
  - name: movies
    mountPath: /media/movies
  - name: tv
    mountPath: /media/tv
  - name: downloads
    mountPath: /media/downloads

# ---------- Extra environment ----------


# ---------- Resources ----------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------- Probes ----------
probes:
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
