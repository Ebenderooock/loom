  /api/v1/discover/{media}/{id}:
    get:
      tags: [discovery]
      operationId: getExternalVideoDetails
      summary: Read full provider metadata and credits without adding a title.
      description: |
        Media is movie or series. The default provider is TMDB; exact IMDb or
        TVDB identities are resolved with TMDB's find API, scoped by media type.
        TVDB-only movie identities are unsupported (422); provide an IMDb or
        TMDB mapping instead.
        Ambiguous matches are rejected, never guessed by title or year.
        A credits failure returns title metadata with a non-empty credits_error.
      security:
        - apiKey: []
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: media
          in: path
          required: true
          schema: { type: string, enum: [movie, series] }
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string, enum: [tmdb, imdb, tvdb], default: tmdb }
      responses:
        "200":
          description: Provider title metadata and available cast and crew.
          content:
            application/json:
              schema:
                type: object
                required: [title, credits, credits_error]
                properties:
                  title:
                    type: object
                    description: MovieMetadata or SeriesMetadata with canonical TMDB and external IDs.
                    additionalProperties: true
                  credits:
                    type: [object, "null"]
                    properties:
                      cast:
                        type: array
                        items: { $ref: "#/components/schemas/ExternalCreditPerson" }
                      crew:
                        type: array
                        items: { $ref: "#/components/schemas/ExternalCreditPerson" }
                  credits_error:
                    type: string
        "400":
          description: Invalid provider identity or media type.
        "404":
          description: No unambiguous title exists for that provider identity.
        "422":
          description: TMDB cannot resolve TVDB movie IDs; an IMDb or TMDB ID is required.
        "502":
          description: Metadata provider unavailable or returned conflicting identity.

