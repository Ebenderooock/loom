  /api/v1/indexers/provider-budgets:
    get:
      tags: [indexers]
      summary: List persistent provider/account budgets (administrator only).
      operationId: listProviderBudgets
      security:
        - apiKey: []
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Persisted state; expired windows roll forward on admission.
          content:
            application/json:
              schema:
                type: object
                required: [budgets]
                properties:
                  budgets:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ProviderBudgetConfig"
                        - type: object
                          required: [id, consumed, reset_at, provider_remaining, provider_reset_at]
                          properties:
                            id:
                              type: string
                            consumed:
                              type: integer
                              format: int64
                            reset_at:
                              type: integer
                              format: int64
                              description: Configured-window reset, Unix seconds.
                            provider_remaining:
                              type: [integer, "null"]
                              format: int64
                              description: Null means no active provider-reported constraint.
                            provider_reset_at:
                              type: integer
                              format: int64
                              description: Provider reset Unix seconds; zero means unknown or unconstrained.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Administrator access required.
        "500":
          description: Cannot read budget accounting.
        "503":
          description: Budget store unavailable.

  /api/v1/indexers/provider-budgets/{budgetID}:
    parameters:
      - name: budgetID
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$'
        description: Opaque operator label, never a credential or hostname-derived identity.
    put:
      tags: [indexers]
      summary: Configure an explicit provider/account group (administrator only).
      operationId: configureProviderBudget
      description: |
        Atomically replaces configured limits and complete membership, retaining
        consumed calls and provider remaining/reset state. No search-time bypass
        or clear-exhaustion operation exists. Manual and streaming searches consume
        the same allowance. Provider exhaustion with an unknown reset fails closed.
        Successful changes emit an indexer.budget_configured audit event.
      security:
        - apiKey: []
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderBudgetConfig"
            example:
              allowance: 100
              window_seconds: 86400
              indexer_ids: [indexer-one, indexer-two]
      responses:
        "204":
          description: Configuration saved; accounting retained.
        "400":
          description: Invalid configuration, duplicate/nonexistent member, or member assigned elsewhere.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Administrator access required.
        "503":
          description: Budget store unavailable.

