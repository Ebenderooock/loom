  /api/v1/discover/recommendations:
    get:
      tags: [discovery]
      summary: Suggest new movies or series based on the existing catalog.
      operationId: getDiscoveryRecommendations
      description: |
        Read-only, bounded TMDB candidate generation. Excludes already-added
        and dismissed titles. Results include provenance and human-readable
        reasons. Does not add, monitor, search for or download titles.
      security:
        - apiKey: []
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: media_type
          in: query
          schema:
            type: string
            enum: [movie, series]
            default: movie
        - name: include_upcoming
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Candidates, potentially with partial-source or stale-cache warnings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DiscoveryStatus"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        maxItems: 60
                        items:
                          $ref: "#/components/schemas/DiscoveryRecommendation"
        "400":
          description: Invalid media_type or include_upcoming.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: TMDB provider or discovery service is not configured.
        "502":
          description: Provider failure or malformed catalog response with no usable fallback.
        "504":
          description: Discovery request deadline/cancellation.
        "500":
          description: Internal storage or library read failed.

  /api/v1/discover/dismissals:
    post:
      tags: [discovery]
      summary: Persist a dismissed recommendation for the current user.
      operationId: dismissDiscoveryRecommendation
      description: Requires an identified user; does not create shared anonymous dismissals.
      security:
        - apiKey: []
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdb_id, media_type]
              properties:
                tmdb_id:
                  type: integer
                  minimum: 1
                media_type:
                  type: string
                  enum: [movie, series]
      responses:
        "204":
          description: Dismissal persisted, including a repeated dismissal.
        "400":
          description: Invalid body, media type or TMDB ID.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Dismissal could not be persisted.
        "503":
          description: Discovery service or dismissal storage is not configured.

