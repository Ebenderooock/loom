      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFormat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [quality]
      summary: Delete custom format (soft delete).
      operationId: deleteCustomFormat
      responses:
        "204":
          description: No content.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/custom-formats/test:
    post:
      tags: [quality]
      summary: Test if a release name matches a custom format.
      operationId: testCustomFormat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCustomFormatRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCustomFormatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    SelectAlbumReleaseRequest:
      type: object
      additionalProperties: false
      required: [release_id]
      properties:
        release_id: { type: string, minLength: 1 }
    MusicAlbum:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        selected_release_id: { type: string }
        releases:
          type: array
          items: { type: object, additionalProperties: true }
        tracks:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: true
    AudioQualityDefinition:
      type: object
      required: [id, name, vbr, lossless, tier_order]
      properties:
        id: { type: string }
        name: { type: string }
        format: { type: string }
        bitrate: { type: integer }
        vbr: { type: boolean }
        lossless: { type: boolean }
        tier_order: { type: integer }
    AudioProfileItem:
      type: object
      required: [definition_id, allowed]
      properties:
        definition_id: { type: string }
        allowed: { type: boolean }
    AudioFormatItem:
      type: object
      required: [format_id, score]
      properties:
        format_id: { type: string }
        score: { type: integer }
    AudioQualityProfile:
      type: object
      required: [id, name, items, upgrade_allowed, format_items, min_format_score, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        items:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AudioProfileItem" }
        cutoff: { type: string }
        upgrade_allowed: { type: boolean }
        format_items:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AudioFormatItem" }
        min_format_score: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateAudioQualityProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AudioProfileItem" }
        cutoff: { type: string }
        upgrade_allowed: { type: boolean, default: true }
        format_items:
          type: array
          items: { $ref: "#/components/schemas/AudioFormatItem" }
        min_format_score: { type: integer, default: 0 }
    UpdateAudioQualityProfileRequest:
      type: object
      properties:
        cutoff: { type: string }
        upgrade_allowed: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/AudioProfileItem" }
        format_items:
          type: array
          items: { $ref: "#/components/schemas/AudioFormatItem" }
        min_format_score: { type: integer }
    MetadataProfile:
      type: object
      required: [id, name, primary_types, secondary_types, release_statuses, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        primary_types:
          type: array
          items: { type: string }
        secondary_types:
          type: array
          items: { type: string }
        release_statuses:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateMetadataProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        primary_types:
          type: array
          items: { type: string }
        secondary_types:
          type: array
          items: { type: string }
        release_statuses:
          type: array
          items: { type: string }
    UpdateMetadataProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        primary_types:
          type: array
          items: { type: string }
        secondary_types:
          type: array
          items: { type: string }
        release_statuses:
          type: array
          items: { type: string }
    CollectionSourceInput:
      type: object
      additionalProperties: false
      required: [provider, kind, external_id]
      properties:
        provider: { type: string, enum: [tmdb, imdb, tvdb] }
        kind: { type: string, enum: [collection, list] }
        external_id:
          type: string
          description: |
            TMDB collection/list and TVDB list IDs are positive numeric IDs.
            IMDb lists use ls followed by digits. Only TMDB supports kind
            collection; IMDb/TVDB require list. No arbitrary URLs.
    CollectionSource:
      type: object
      required: [provider, kind, external_id]
      properties:
        provider: { type: string, enum: [tmdb, imdb, tvdb] }
        kind: { type: string, enum: [collection, list] }
        external_id: { type: string }
        last_sync: { type: string, format: date-time }
        error:
          type: string
          description: Safe visible source access/mapping failure; previous contribution retained.
    CollectionTitleIDs:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        tmdb: { type: string, pattern: "^[1-9][0-9]{0,11}$" }
        imdb: { type: string, pattern: "^tt[0-9]{1,12}$" }
        tvdb: { type: string, pattern: "^[1-9][0-9]{0,11}$" }
    CollectionMember:
      type: object
      required: [id, media_type, title, external_ids, sources, provenance, local, excluded, in_library, monitored]
      properties:
        id: { type: string, format: uuid }
        media_type: { type: string, enum: [movie, series] }
        title: { type: string }
        year: { type: integer }
        poster_path: { type: string }
        overview: { type: string }
        release_date: { type: string }
        external_ids: { $ref: "#/components/schemas/CollectionTitleIDs" }
        sources:
          type: array
          items: { type: string }
          description: Current contributing provider:kind:external-ID keys.
        provenance:
          type: array
          items: { type: string }
          description: Historical contributing source keys, retained with local intent.
        local: { type: boolean }
        excluded: { type: boolean }
        media_id:
          type: string
          description: Actual local movie/series ID for the normal management details.
        library_id: { type: string }
        in_library: { type: boolean }
        monitored: { type: boolean }
        has_file:
          type: boolean
          description: Computed on detail reads. For shows, at least one imported episode file.
    CollectionScanStatus:
      type: object
      required: [total, checked, pending, failed, running, errors]
      properties:
        total: { type: integer, minimum: 0 }
        checked: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        running: { type: boolean }
        errors:
          type: array
          maxItems: 10
          items:
            type: object
            required: [media_type, media_id, message]
            properties:
              media_type: { type: string, enum: [movie, series] }
              media_id: { type: string }
              message: { type: string }
    LoomCollection:
      type: object
      required: [id, name, overview, sources, members, revision, total, in_library]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        overview: { type: string }
        revision: { type: integer, minimum: 0 }
        total: { type: integer, description: Non-excluded member count on reads. }
        in_library: { type: integer, description: Non-excluded members currently added to Loom on reads. }
        quality_profile_id:
          type: string
          description: Default quality profile for titles added from this collection. Never changes existing titles implicitly.
        sources:
          type: array
          items: { $ref: "#/components/schemas/CollectionSource" }
        members:
          type: array
          items: { $ref: "#/components/schemas/CollectionMember" }
    CollectionSelection:
      type: object
      description: Exactly one of member_ids or all=true.
      properties:
        member_ids: { type: array, maxItems: 5000, items: { type: string } }
        all: { type: boolean }
    CollectionAddSettings:
      type: object
      additionalProperties: false
      properties:
        library_id: { type: string }
        quality_profile_id: { type: string }
        monitored: { type: boolean, default: true }
        search: { type: boolean, description: Search after adding (monitored titles only). }
    CollectionBulkItem:
      type: object
      required: [member_id, media_type, title, status]
      properties:
        member_id: { type: string }
        media_type: { type: string, enum: [movie, series] }
        title: { type: string }
        year: { type: integer }
        media_id: { type: string }
        status: { type: string, enum: [eligible, skipped, queued, running, done, failed] }
        reason:
          type: string
          description: Skip reason code.
          enum: [excluded, in_library, unresolved, unreleased, no_library, no_profile, already_running, not_in_library, unmonitored, has_file, nothing_missing, unchanged]
        detail: { type: string }
        current_profile_id: { type: string }
        new_profile_id: { type: string }
        missing_episodes: { type: integer }
    CollectionJob:
      type: object
      description: In-process background job; not persisted across restarts.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [add, search] }
        collection_id: { type: string }
        status: { type: string, enum: [running, done] }
        items: { type: array, items: { $ref: "#/components/schemas/CollectionBulkItem" } }
        counts: { type: object, additionalProperties: { type: integer } }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    CollectionBulkPlan:
      type: object
      properties:
        kind: { type: string, enum: [add, search, quality] }
        items: { type: array, items: { $ref: "#/components/schemas/CollectionBulkItem" } }
        counts: { type: object, additionalProperties: { type: integer } }
        settings: { type: object, additionalProperties: { $ref: "#/components/schemas/CollectionAddSettings" } }
        libraries: { type: object, additionalProperties: { type: array, items: { $ref: "#/components/schemas/CollectionOption" } } }
        profiles: { type: array, items: { $ref: "#/components/schemas/CollectionOption" } }
        job: { $ref: "#/components/schemas/CollectionJob" }
        note: { type: string }
    CollectionOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        quality_profile_id: { type: string }
    ExternalCreditPerson:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        department: { type: string }
        profile_path: { type: string }
        order: { type: integer }

    DiscoveryStatus:
      type: object
      required: [warnings, generated_at, stale]
      properties:
        warnings:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
          description: Time the cached candidate snapshot was generated.
        stale:
          type: boolean
          description: Expired provider data was served with a warning.

    DiscoveryRecommendation:
      type: object
      required: [tmdb_id, media_type, title, year, rating, popularity, reasons, source]
      properties:
        tmdb_id:
          type: integer
          minimum: 1
        media_type:
          type: string
          enum: [movie, series]
        title:
          type: string
        year:
          type: integer
        overview:
          type: string
        poster_path:
          type: string
          description: Full TMDB image URL, when available.
        rating:
          type: number
        popularity:
          type: number
        release_date:
          type: string
          format: date
        reasons:
          type: array
          items:
            type: string
        source:
          type: string
          description: Candidate source provenance.
        collection_id:
          type: integer
          minimum: 1

    DiscoveryCollection:
      type: object
      required: [id, name, total, in_library, missing, upcoming]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        overview:
          type: string
        poster_path:
          type: string
          description: Full TMDB image URL, when available.
        total:
          type: integer
        in_library:
          type: integer
          description: Catalog entries, not necessarily imported files.
        missing:
          type: integer
          description: Released or undated members without a Loom catalog entry.
        upcoming:
          type: integer
          description: Future-dated members without a Loom catalog entry.

    DiscoveryCollectionItem:
      allOf:
        - $ref: "#/components/schemas/DiscoveryRecommendation"
        - type: object
          required: [in_library, monitored]
          properties:
            in_library:
              type: boolean
            media_id:
              type: string
            has_file:
              type: boolean
              description: Whether Loom records an imported file; omitted if status is unavailable.
            monitored:
              type: boolean

    TitleFile:
      type: object
      required: [path, size, tracked]
      properties:
        path:
          type: string
          description: Slash-separated path relative to the server-resolved title folder.
        size:
          type: integer
          format: int64
          minimum: 0
          description: File size in bytes.
        tracked:
          type: boolean
          description: Whether Loom currently tracks this as a movie or episode file.
        quality:
          type: string
        format:
          type: string
          description: Recorded format/codec when known, otherwise the file extension.
    RequestAvailability:
      type: string
      enum: [present, missing, unknown]
      description: "Current verified file presence, independent of historical fulfillment."
    MediaRequest:
      type: object
      required: [id, user_id, username, media_type, tmdb_id, title, year, status, availability, availability_reason, media_server_availability, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        username: { type: string }
        media_type: { type: string, enum: [movie, series, artist] }
        tmdb_id: { type: string }
        title: { type: string }
        year: { type: integer }
        poster_path: { type: string }
        overview: { type: string }
        status:
          type: string
          enum: [pending, approving, approved, available, rejected, failed]
          description: "available is historical fulfillment (UI label Fulfilled), not current presence."
        reason: { type: string }
        media_id: { type: string }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        fulfilled_at:
          type: string
          format: date-time
          description: "First verified fulfillment. Legacy fulfilled rows use their prior updated_at."
        availability: { $ref: "#/components/schemas/RequestAvailability" }
        availability_reason: { type: string }
        availability_checked_at: { type: string, format: date-time }
        re_request_of: { type: string }
        monitored: { type: boolean, description: "Current catalog monitoring; omitted if no linked entry remains." }
        media_server_availability:
          $ref: "#/components/schemas/RequestAvailability"
          description: "Currently always unknown; external server observations are not inferred from local files."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RequestReconciliation:
      type: object
      required: [id, actor, dry_run, created_at, outcomes]
      properties:
        id: { type: string }
        actor: { type: string }
        dry_run: { type: boolean }
        created_at: { type: string, format: date-time }
        outcomes:
          type: array
          items:
            type: object
            required: [request_id, before, after, reason, changed]
            properties:
              request_id: { type: string }
              before: { $ref: "#/components/schemas/RequestAvailability" }
              after: { $ref: "#/components/schemas/RequestAvailability" }
              reason: { type: string }
              changed: { type: boolean }
              error: { type: string }
    ProviderBudgetConfig:
      type: object
      required: [allowance, window_seconds, indexer_ids]
      properties:
        allowance:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        window_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31622400
        indexer_ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Complete group membership; each definition can belong to only one group.

    DecisionEvidence:
      type: object
      required: [field, expected, actual, unit, passed]
      description: |
        Actual-engine comparison. Absence of a check means evaluation stopped;
        identity observations can be corroborated by other identity evidence.
      properties:
        field: { type: string }
        expected: { type: string }
        actual: { type: string }
        unit: { type: string }
        passed: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Probe status verb.
          examples: [ok, alive, ready, starting, "db unreachable"]

    SystemStatus:
      type: object
      required: [version, commit, buildDate, engine]
      properties:
        version:
          type: string
          description: Loom semver (or `dev` for unstamped builds).
        commit:
          type: string
          description: Short git commit SHA.
        buildDate:
          type: string
          description: Build timestamp (RFC 3339, UTC).
        engine:
          type: string
          enum: [sqlite, postgres]
          description: Active storage engine.

    Indexer:
      type: object
      required: [id, kind, name, enabled, priority, categories, tags]
      properties:
        id:
          type: string
          description: Slug identifier; generated from kind+name when omitted on create.
        kind:
          type: string
          description: |
            Factory key. Built-in kinds: `builtin/null`. Real source
            kinds: `newznab`, `torznab`, `cardigann`.
          enum:
            - builtin/null
            - newznab
            - torznab
            - cardigann
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 100
        config:
          description: |
            Free-form, kind-specific configuration. The shape is
            documented per kind; for `newznab` and `torznab` it
            matches `NewznabConfig`, for `cardigann` it matches
            `CardigannConfig`.
          oneOf:
            - $ref: "#/components/schemas/NewznabConfig"
            - $ref: "#/components/schemas/CardigannConfig"
            - type: object
              additionalProperties: true
        categories:
          type: array
          description: Newznab category IDs.
          items:
            type: integer
        tags:
          type: array
          items:
            type: string
        proxy_id:
          type: string
          description: Optional reference to a `proxies.id`. When set, all outbound HTTP traffic from this indexer is routed through the matching proxy row.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IndexerWithHealth:
      allOf:
        - $ref: "#/components/schemas/Indexer"
        - type: object
          properties:
            health:
              $ref: "#/components/schemas/IndexerHealth"
            rate_limit:
              $ref: "#/components/schemas/IndexerRateLimit"

    IndexerRateLimit:
      type: object
      description: |
        Per-indexer rate-limit + retry configuration. The first three
        fields reflect the overrides stored on the row (any may be
        absent); the `effective_*` fields are what the runtime is
        actually applying after defaults are merged in.
      required: [effective_per_minute, effective_burst, effective_max_retries]
      properties:
        per_minute:
          type: integer
          minimum: 1
          description: Override for the token-bucket fill rate (req/min). Absent when the row stores NULL.
        burst:
          type: integer
          minimum: 1
          description: Override for the token-bucket capacity. Absent when the row stores NULL.
        max_retries:
          type: integer
          minimum: 0
          description: Override for the retry budget. Absent when the row stores NULL.
        effective_per_minute:
          type: integer
          description: Per-minute fill rate the runtime is using.
        effective_burst:
          type: integer
          description: Burst capacity the runtime is using.
        effective_max_retries:
          type: integer
          description: Retry budget the runtime is using.

    IndexerCreate:
      type: object
      required: [kind, name]
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          default: 25
        config:
          type: object
          additionalProperties: true
        categories:
          type: array
          items:
            type: integer
        tags:
          type: array
          items:
            type: string
        proxy_id:
          type: string
          description: Optional `proxies.id` to attach on creation.
        rate_limit_per_min:
          type: integer
          minimum: 1
          description: Optional override for the token-bucket fill rate. Omit to use the package default (60 req/min).
        rate_limit_burst:
          type: integer
          minimum: 1
          description: Optional override for the token-bucket capacity. Omit to use the package default (5).
        retry_max_attempts:
          type: integer
          minimum: 0
          description: Optional override for the retry budget. Pass `0` to disable retries entirely; omit to use the package default (3).

    IndexerPatch:
      type: object
      description: Any subset of fields. Omitted fields are left untouched.
      properties:
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        config:
          type: object
          additionalProperties: true
        categories:
          type: array
          items:
            type: integer
        tags:
          type: array
          items:
            type: string
        proxy_id:
          type: string
          nullable: true
          description: Set to a proxy ID to pin outbound traffic. Send `null` (or empty string) to clear the existing pin.
        rate_limit_per_min:
          type: integer
          minimum: 1
          description: Set the token-bucket fill rate override. Omit to leave unchanged.
        rate_limit_burst:
          type: integer
          minimum: 1
          description: Set the token-bucket capacity override. Omit to leave unchanged.
        retry_max_attempts:
          type: integer
          minimum: 0
          description: Set the retry budget override. Pass `0` to disable retries; omit to leave unchanged.

    IndexerHealth:
      type: object
      required: [indexer_id, status, last_checked_at]
      properties:
        indexer_id:
          type: string
        status:
          type: string
          enum: [ok, degraded, failed, unknown]
        last_checked_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        latency_ms:
          type: integer
          description: Round-trip time of the last `Test()` call, in milliseconds.
        last_error:
          type: string
          description: Last error message, if any.

    NewznabConfig:
      type: object
      description: |
        Configuration shape used by both the `newznab` and `torznab`
        kinds. Operator slip-ups are tolerated: a trailing `/` on
        `url` is stripped, and an embedded `?apikey=` is extracted
        into `api_key` when that field is empty.
      required: [url, api_key]
      properties:
        url:
          type: string
          format: uri
          description: Base URL of the upstream feed (e.g. `https://nzbhydra.example/api`).
        api_key:
          type: string
          description: Per-indexer API key.
        user_agent:
          type: string
          description: Optional override for the outbound User-Agent header.
        timeout:
          type: string
          description: Go duration string (e.g. `30s`, `2m`). Default `30s`.
          example: 30s
        category_map:
          type: object
          description: Optional alias → upstream category IDs map (reserved for future use).
          additionalProperties:
            type: array
            items:
              type: integer

    CardigannConfig:
      type: object
      description: |
        Configuration shape used by the `cardigann` kind. The
        definition referenced by `definition_id` must already be
        present on disk under the configured `definitions_dir`
        (default `<data_dir>/definitions/cardigann/`); the API does
        not accept inline definitions to keep arbitrary remote YAML
        out of the trust boundary.
      required: [definition_id]
      properties:
        definition_id:
          type: string
          description: Filename (without `.yml`/`.yaml`) of the on-disk definition.
        username:
          type: string
          description: Tracker username (form-login flow).
        password:
          type: string
          description: Tracker password (form-login flow).
        passkey:
          type: string
          description: Optional per-user RSS / download passkey templated into search inputs.
        cookie:
          type: string
          description: |
            Pre-baked `name=value; name2=value2` cookie string, used
            when the tracker requires a manual session import instead
            of form login.
        credentials:
          type: object
          description: Free-form additional credentials exposed to login/search templates as `{{ .Config.<key> }}`.
          additionalProperties:
            type: string
        category_overrides:
          type: object
          description: |
            Operator override for site-category-id → Newznab-category-id
            mapping. Wins over the definition's `categorymappings`.
          additionalProperties:
            type: integer
        user_agent:
          type: string
          description: Optional override for the outbound User-Agent header.
        timeout:
          type: string
          description: Go duration string (e.g. `30s`, `2m`). Default `30s`.
          example: 30s


    TestResult:
      type: object
      required: [ok, latency_ms]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
        error:
          type: string

    Proxy:
      type: object
      required: [id, kind, name, enabled, config]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [http, https, socks5, flaresolverr]
        name:
          type: string
        enabled:
          type: boolean
        config:
          oneOf:
            - $ref: "#/components/schemas/ProxyHTTPConfig"
            - $ref: "#/components/schemas/ProxySOCKS5Config"
            - $ref: "#/components/schemas/ProxyFlareSolverrConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProxyCreate:
      type: object
      required: [kind, name, config]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [http, https, socks5, flaresolverr]
        name:
          type: string
        enabled:
          type: boolean
          default: true
        config:
          oneOf:
            - $ref: "#/components/schemas/ProxyHTTPConfig"
            - $ref: "#/components/schemas/ProxySOCKS5Config"
            - $ref: "#/components/schemas/ProxyFlareSolverrConfig"

    ProxyPatch:
      type: object
      description: Any subset of fields. When `kind` is supplied, `config` must match the new kind.
      properties:
        name:
          type: string
        enabled:
          type: boolean
        kind:
          type: string
          enum: [http, https, socks5, flaresolverr]
        config:
          oneOf:
            - $ref: "#/components/schemas/ProxyHTTPConfig"
            - $ref: "#/components/schemas/ProxySOCKS5Config"
            - $ref: "#/components/schemas/ProxyFlareSolverrConfig"

    ProxyHTTPConfig:
      type: object
      required: [url]
      description: Used by both `http` and `https` kinds.
      properties:
        url:
          type: string
          format: uri
          description: Proxy URL, e.g. `http://gateway:3128` or `https://gateway:3128`.
        username:
          type: string
        password:
          type: string

    ProxySOCKS5Config:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: SOCKS5 endpoint as `host:port`.
        username:
          type: string
        password:
          type: string

    ProxyFlareSolverrConfig:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Base URL of the FlareSolverr instance (no trailing slash).
        max_timeout_sec:
          type: integer
          description: Per-request maxTimeout in seconds sent to FlareSolverr. Defaults to the kernel `flaresolverr_default_timeout`.
        session_mode:
          type: string
          enum: ["", none, shared]
          description: |
            `shared` lazily creates one FlareSolverr session per proxy row and
            reuses it across requests. Empty/`none` disables session reuse.

    ProxyTestResult:
      type: object
      required: [ok, latency_ms]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
        status_code:
          type: integer
          description: HTTP status returned by the probe (or FlareSolverr `sessions.list`).
        error:
          type: string

    ProxyInUseError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [proxy_in_use]
            message:
              type: string
            details:
              type: object
              properties:
                indexer_ids:
                  type: array
                  items:
                    type: string

    Caps:
      type: object
      required: [search_types, categories, supported_ids]
      properties:
        search_types:
          type: array
          description: Newznab-style search modes (e.g. `search`, `tv-search`, `movie-search`).
          items:
            type: string
        categories:
          type: array
          items:
            type: integer
        supported_ids:
          type: array
          description: External ID schemes accepted in searches (e.g. `imdb`, `tvdb`, `tmdb`).
          items:
            type: string

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        categories:
          type: array
          items:
            type: integer
        indexer_ids:
          type: array
          description: Restrict the fan-out to this subset of indexer IDs.
          items:
            type: string
        timeout_ms:
          type: integer
          description: Per-indexer ceiling override for this call only.

    Result:
      type: object
      required: [indexer_id, title, link]
      properties:
        indexer_id:
          type: string
        title:
          type: string
        link:
          type: string
          format: uri
        info_url:
          type: string
          format: uri
        size_bytes:
          type: integer
          format: int64
        quality:
          type: string
          description: |
            Free-form release quality / release-group label
            (e.g. `1080p`, `WEB-DL`). Optional; not all indexers
            advertise this field.
        infohash:
          type: string
          description: |
            BitTorrent v1 infohash as a 40-character hex string.
            Empty for Usenet results and for torrent indexers that
            omit the attribute.
        seeders:
          type: integer
          nullable: true
          description: |
            Torrent seeder count reported by the indexer. Omitted
            (null) for Usenet results, where the concept does not
            apply. A value of `0` means "no seeders right now" and
            is distinct from "not reported".
        peers:
          type: integer
          nullable: true
          description: |
            Torrent peer count (seeders + leechers, per the Torznab
            spec). Omitted for Usenet results. When upstream reports
            only `leechers`, Loom synthesises this as
            `seeders + leechers`.
        magnet_uri:
          type: string
          description: |
            Optional `magnet:` link. Some trackers advertise one in
            addition to (or instead of) a `.torrent` `link`. Empty
            when not provided.
        publish_date:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: integer

    AggregatedResults:
      type: object
      required: [results, errors]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Result"
        errors:
          type: object
          description: Per-indexer error messages, keyed by indexer ID. Empty object when all sources succeeded.
          additionalProperties:
            type: string
        diagnostics:
          type: object
          properties:
            total_results:
              type: integer
            search_duration_ms:
              type: integer
              format: int64
            indexers:
              type: array
              items:
                type: object
                required: [id, name, status, response_time_ms, result_count]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum: [ok, error, timeout, skipped]
                  response_time_ms:
                    type: integer
                    format: int64
                  result_count:
                    type: integer
                  error_message:
                    type: string
                    description: Failure or skip reason, including UTC resume time or unknown provider reset.
                  resume_at:
                    type: integer
                    format: int64
                    description: Unix seconds when provider budget admission can resume; omitted when unknown.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [bad_request, not_found, conflict, internal]
            message:
              type: string

    DownloadClient:
      type: object
      required: [id, name, kind, protocol, enabled, priority]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: Kind identifier (e.g. `qbittorrent`, `transmission`, `builtin/null`).
        protocol:
          type: string
          enum: [torrent, usenet]
        enabled:
          type: boolean
        priority:
          type: integer
          description: Lower wins when multiple clients accept the same protocol.
        category_default:
          type: string
        save_path_default:
          type: string
        remove_completed:
          type: boolean
        remove_failed:
          type: boolean
        config:
          type: object
          description: Kind-specific JSON config blob.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        health:
          $ref: "#/components/schemas/DownloadClientHealth"

    DownloadClientCreate:
      type: object
      required: [name, kind, protocol]
      properties:
        id:
          type: string
          description: Optional. Auto-generated if omitted.
        name:
          type: string
        kind:
          type: string
        protocol:
          type: string
          enum: [torrent, usenet]
        enabled:
          type: boolean
        priority:
          type: integer
        category_default:
          type: string
        save_path_default:
          type: string
        remove_completed:
          type: boolean
        remove_failed:
          type: boolean
        config:
          type: object
          additionalProperties: true

    DownloadClientPatch:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        category_default:
          type: string
        save_path_default:
          type: string
        remove_completed:
          type: boolean
        remove_failed:
          type: boolean

    DownloadClientHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unknown, ok, warning, error]
        last_checked_at:
          type: string
          format: date-time
        last_error:
          type: string
        consecutive_failures:
          type: integer
        last_free_space_bytes:
          type: integer
          format: int64

    DownloadCategory:
      type: object
      required: [name]
      properties:
        name:
          type: string
        save_path:
          type: string

    DownloadFreeSpace:
      type: object
      required: [bytes]
      properties:
        bytes:
          type: integer
          format: int64
          description: Free space in bytes. -1 when the client cannot report it.

    # Per-kind config blob shapes. The `config` field on
    # DownloadClient/DownloadClientCreate is `additionalProperties: true`;
    # these schemas document the recognised shape per kind so generators
    # can offer typed input. New kinds append a sibling schema here.
    QbittorrentConfig:
      type: object
      description: |
        Configuration blob for `kind: qbittorrent`. Persisted in the
        `download_clients.config` JSON column. qBittorrent 4.1+ is
        required for the v2 Web API; v5.x is supported with no
        additional opt-in.
      required: [host]
      properties:
        host:
          type: string
          description: Hostname or IP of the qBittorrent Web UI.
        port:
          type: integer
          description: TCP port the Web UI listens on (e.g. `8080`).
        tls:
          type: boolean
          description: Set to `true` when the Web UI is served over HTTPS.
        base_path:
          type: string
          default: "/"
          description: |
            URL prefix when qBittorrent is behind a reverse proxy
            subpath (e.g. `/qbt`). Defaults to `/`.
        username:
          type: string
          description: Web UI username.
        password:
          type: string
          format: password
          writeOnly: true
          description: Web UI password. Never returned on read responses.

    SabnzbdConfig:
      type: object
      description: |
        Configuration blob for `kind: sabnzbd`. Persisted in the
        `download_clients.config` JSON column. SABnzbd 3.x and newer
        is required; the kind speaks the `output=json` API and
        authenticates with the operator's apikey on every request.
      required: [host, apikey]
      properties:
        host:
          type: string
          description: Hostname or IP of the SABnzbd Web UI.
        port:
          type: integer
          description: TCP port SABnzbd listens on (e.g. `8080`).
        tls:
          type: boolean
          description: Set to `true` when SABnzbd is served over HTTPS.
        base_path:
          type: string
          default: "/"
          description: |
            URL prefix when SABnzbd is behind a reverse proxy subpath
            (e.g. `/sabnzbd`). Defaults to `/`. The kind appends
            `api?...` to this path so a leading `/` is required.
        apikey:
          type: string
          format: password
          writeOnly: true
          description: |
            SABnzbd general API key. Find it in SABnzbd under
            Config → General → Security. Never returned on read
            responses.

    NzbgetConfig:
      type: object
      description: |
        Configuration blob for `kind: nzbget`. Persisted in the
        `download_clients.config` JSON column. NZBGet 21+ is
        targeted; the kind speaks JSON-RPC 2.0 at `<base_path>/jsonrpc`
        and authenticates with HTTP Basic Auth on every request.
      required: [host, username, password]
      properties:
        host:
          type: string
          description: Hostname or IP of the NZBGet control interface.
        port:
          type: integer
          description: TCP port NZBGet listens on (e.g. `6789`).
        tls:
          type: boolean
          description: Set to `true` when NZBGet is fronted by HTTPS.
        base_path:
          type: string
          default: "/"
          description: |
            URL prefix when NZBGet is behind a reverse proxy subpath.
            Defaults to `/`. The kind appends `jsonrpc` so a leading
            `/` is required.
        username:
          type: string
          description: |
            NZBGet `ControlUsername`. Configured under Settings →
            Security in the NZBGet web UI.
        password:
          type: string
          format: password
          writeOnly: true
          description: |
            NZBGet `ControlPassword`. Never returned on read
            responses.

    DownloadItem:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          description: Lifecycle verb (e.g. `queued`, `downloading`, `seeding`, `completed`, `paused`, `failed`).
        category:
          type: string
        save_path:
          type: string
        size_bytes:
          type: integer
          format: int64
        downloaded_bytes:
          type: integer
          format: int64
        progress:
          type: number
          format: float
        eta_seconds:
          type: integer
        queue_position:
          type: integer
          minimum: 0
          description: Zero-based position within the download client's queue. Omitted when unavailable or not queued.
        ratio:
          type: number
          format: float
        error:
          type: string

    DownloadAddRequest:
      type: object
      description: |
        Submit a new download. Provide at least one of `magnet`, `url`, or
        `content` (base64). `category` and `save_path` override client defaults.
      properties:
        magnet:
          type: string
        url:
          type: string
        content:
          type: string
          format: byte
          description: Base64-encoded .torrent or .nzb file.
        category:
          type: string
        save_path:
          type: string
        paused:
          type: boolean
        ignore_blocklist:
          type: boolean
          description: |
            Grab the release even when it matches the blocklist (by info hash
            or title). Defaults to false, which rejects blocklisted releases
            with `409 blocklisted`.

    DownloadAddResult:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string

    DownloadIDsRequest:
      type: object
      description: |
        Optional body for pause/resume. Empty/omitted body acts on all matching
        items in the client.
      properties:
        ids:
          type: array
          items:
            type: string

    QualityDefinition:
      type: object
      required: [id, name, source, resolution]
      properties:
        id:
          type: string
          description: Unique quality definition identifier (slugified name).
        name:
          type: string
          description: Display name for the quality tier.
        title:
          type: string
          description: Long-form title for UI display.
        source:
          type: string
          description: Source tier (e.g. BluRay, WebRip, HDTV).
        resolution:
          type: string
          description: Resolution tier (e.g. 1080p, 720p, 2160p).
        modifier:
          type: string
          description: Optional modifier (e.g. REMUX, PROPER).
        min_file_size:
          type: integer
          format: int64
          description: Minimum file size in bytes.
        max_file_size:
          type: integer
          format: int64
          description: Maximum file size in bytes.
        preferred_at:
          type: integer
          description: Ranking score for preference scoring.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    CreateQualityDefinitionRequest:
      type: object
      required: [name, source, resolution]
      properties:
        name:
          type: string
        title:
          type: string
        source:
          type: string
        resolution:
          type: string
        modifier:
          type: string
        min_file_size:
          type: integer
          format: int64
        max_file_size:
          type: integer
          format: int64
        preferred_at:
          type: integer

    UpdateQualityDefinitionRequest:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        source:
          type: string
        resolution:
          type: string
        modifier:
          type: string
        min_file_size:
          type: integer
          format: int64
        max_file_size:
          type: integer
          format: int64
        preferred_at:
          type: integer

    QualityProfileItem:
      type: object
      required: [id, name, allowed]
      properties:
        id:
          type: string
          description: Quality definition ID.
        name:
          type: string
          description: Quality definition name.
        preferred:
          type: boolean
          description: Whether this quality is preferred.
        allowed:
          type: boolean
          description: Whether this quality is allowed in the profile.

    QualityProfile:
      type: object
      required: [id, name, cutoff, items]
      properties:
        id:
          type: string
          description: Unique profile identifier (slugified name).
        name:
          type: string
          description: Profile name.
        upgrade_allowed:
          type: boolean
          description: Whether upgrades are allowed after initial grab.
        cutoff:
          type: string
          description: Quality definition ID that serves as upgrade target. Must exist in items and be allowed.
        language:
          type: string
          description: ISO 639-1 language code.
        format_items:
          type: array
          description: Custom format scoring array (placeholder for Phase 5c).
          items:
            type: object
        min_format_score:
          type: integer
          description: Minimum format score threshold.
        cutoff_format_score:
          type: integer
          description: Format score at which to stop upgrading.
        items:
          type: array
          description: Quality definitions in this profile with allowed/preferred flags.
          items:
            $ref: "#/components/schemas/QualityProfileItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    CreateQualityProfileRequest:
      type: object
      required: [name, cutoff, items]
      properties:
        name:
          type: string
        upgrade_allowed:
          type: boolean
        cutoff:
          type: string
          description: Quality definition ID that serves as upgrade target.
        language:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityProfileItem"

    UpdateQualityProfileRequest:
      type: object
      properties:
        name:
          type: string
        upgrade_allowed:
          type: boolean
        cutoff:
          type: string
        language:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityProfileItem"

    CustomFormat:
      type: object
      required: [id, name, filters]
      properties:
        id:
          type: string
          description: Unique format identifier (slugified name).
        name:
          type: string
          description: Format name.
        description:
          type: string
          description: Optional description.
        tags:
          type: array
          items:
            type: string
          description: Optional tags for grouping.
        filters:
          type: array
          description: List of filter conditions (implicit AND).
          items:
            $ref: "#/components/schemas/CustomFormatFilter"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    CustomFormatFilter:
      type: object
      required: [id, field, condition, value, order]
      properties:
        id:
          type: string
          description: Unique filter identifier.
        field:
          type: string
          enum: [codec, source, year, bitdepth, resolution, hdr, audio, language]
          description: Release metadata field to match against.
        condition:
          type: string
          enum: [equals, regex, range, in, gt, gte, lt, lte]
          description: Matching condition type.
        value:
          type: string
          description: Condition-specific value (regex pattern, comma-separated list, numeric range).
        order:
          type: integer
          description: Filter order (for AND composition).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCustomFormatRequest:
      type: object
      required: [name, filters]
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/CreateCustomFormatFilterRequest"

    CreateCustomFormatFilterRequest:
      type: object
      required: [field, condition, value]
      properties:
        field:
          type: string
          enum: [codec, source, year, bitdepth, resolution, hdr, audio, language]
        condition:
          type: string
          enum: [equals, regex, range, in, gt, gte, lt, lte]
        value:
          type: string

    UpdateCustomFormatRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/CreateCustomFormatFilterRequest"

    TestCustomFormatRequest:
      type: object
      required: [release_name]
      properties:
        release_name:
          type: string
          description: Release name to test against the custom format.

    TestCustomFormatResponse:
      type: object
      required: [custom_format_id, release_name, matches]
      properties:
        custom_format_id:
          type: string
        release_name:
          type: string
        matches:
          type: boolean
          description: Whether the release name matches all filters.

    LibraryHealthReport:
      type: object
      required:
        - library_id
        - root
        - status
        - checked_at
        - scanned_entries
        - inspected_records
        - entry_limit
        - warnings
        - findings
      properties:
        library_id:
          type: string
        root:
          type: string
        status:
          type: string
          enum: [complete, incomplete, unavailable, cancelled]
        checked_at:
          type: string
          format: date-time
        scanned_entries:
          type: integer
          minimum: 0
        inspected_records:
          type: integer
          minimum: 0
        entry_limit:
          type: integer
          minimum: 1
        warnings:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/LibraryHealthFinding"

    LibraryHealthFinding:
      type: object
      required:
        - id
        - kind
        - path
        - related_paths
        - evidence
        - confidence
        - dismissed
        - preview
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [sample, duplicate, orphan_record, untracked_file, missing_file, protected]
        path:
          type: string
        related_paths:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: string
        confidence:
          type: string
          enum: [low, medium, high]
        dismissed:
          type: boolean
        preview:
          $ref: "#/components/schemas/LibraryHealthPreview"

    LibraryHealthPreview:
      type: object
      required: [action, outcome, executable]
      properties:
        action:
          type: string
        outcome:
          type: string
        executable:
          type: boolean

    LibraryHealthDismissRequest:
      type: object
      required: [finding_id, dismissed]
      properties:
        finding_id:
          type: string
        dismissed:
          type: boolean

  parameters:
    CollectionID:
      name: id
      in: path
      required: true
      description: Loom collection UUID, not a provider ID; merged IDs resolve to the canonical collection.
      schema: { type: string, format: uuid }
    TitleFileMediaType:
      name: mediaType
      in: path
      required: true
      schema:
        type: string
        enum: [movie, series]
    TitleFileID:
      name: id
      in: path
      required: true
      schema:
        type: string
    TitleFileSeason:
      name: season
      in: query
      required: false
      description: Series season scope only; zero selects specials.
      schema:
        type: integer
        minimum: 0
    DownloadClientID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IndexerID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProxyID:
      name: id
      in: path
      required: true
      schema:
        type: string
    LibraryID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: The request body or parameters could not be processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: A resource with the same identifier already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Long-lived API key. Issued via the UI / `loom apikey` CLI in
        Phase 1c. Stored at rest as a SHA-256 hash plus a 4-character
        non-secret prefix.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer token (placeholder for OIDC access tokens). Auth routes
        consuming this scheme land in Phase 1c.
    cookieAuth:
      type: apiKey
      in: cookie
      name: loom_session
      description: |
        HTTP-only session cookie issued by the forms-login flow.
        Auth routes consuming this scheme land in Phase 1c.

# Endpoints implemented today are intentionally unauthenticated; once
# the Phase 1c auth PR lands, security requirements will be applied
# at the operation level.
security: []
