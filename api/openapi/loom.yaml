openapi: 3.1.0
info:
  title: Loom API
  version: 0.1.0-alpha
  summary: Native HTTP API for Loom — unified media automation.
  description: |
    Loom's native API is served under `/api/v1/*`. Wire-compatible
    surfaces (`/api/v3/*` for Radarr / Sonarr, `/api/v1/*` for Prowlarr)
    are added in Phase 7 and are documented separately.

    This specification covers only the routes implemented today. The
    PR template requires every new route to be reflected here.

    When authentication is enabled, indexer, download-client and proxy
    configuration mutations and connectivity tests require an administrator.
    Indexer-rule mutations, Jackett imports, query logs and search-health
    diagnostics/reset also require an administrator. Authenticated non-admin
    users retain search and download-use access.

    Movie and series additions default an omitted, empty or whitespace-only
    quality profile selection to the stored Any profile. Explicit selections
    are preserved. If Any is unavailable, creation fails instead of saving a
    title without a quality profile. Existing titles are not reassigned.
    Legacy import-list placeholder "default" also resolves to Any unless it
    identifies an active profile. Movie and series responses include
    qualityProfileMissing for blank, deleted or dangling selections, checking
    both current and active legacy profiles.

    Integration configuration and health/test responses redact credentials.
    On configuration edits, omitted, blank or masked credential values retain
    stored secrets; non-empty replacement values update them. Unsaved
    connectivity tests can supply the saved definition ID to retain credentials
    without saving the tested settings. Explicitly disabled authentication
    retains its existing access behavior.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Loom maintainers
    url: https://github.com/ebenderooock/loom
servers:
  - url: http://localhost:1925
    description: Local dev server.
  - url: https://{host}
    description: Self-hosted instance behind a reverse proxy.
    variables:
      host:
        default: loom.example.com

tags:
  - name: pairing
    description: Expiring TV authorization with explicit browser approval.
  - name: health
    description: Liveness, readiness and metrics probes.
  - name: system
    description: Build / runtime metadata.
  - name: libraries
    description: Library root registration, scans and read-only health reporting.
  - name: indexers
    description: Indexer CRUD, capabilities, manual health checks, and aggregated search.
  - name: proxies
    description: Outbound proxy records (HTTP/HTTPS/SOCKS5/FlareSolverr) attachable to indexers.
  - name: download-clients
    description: |
      Download client CRUD, manual health checks, and per-client operations
      (categories, free-space, item add/list/pause/resume). See
      `docs/downloads.md` and ADR-0014 for the design rationale.
  - name: aggregator
    description: |
      Prowlarr-compatible Newznab/Torznab aggregator surface. Wraps every enabled
      indexer behind a single endpoint that Sonarr/Radarr/Lidarr clients can be pointed
      at. See `docs/indexers-aggregator.md` for the full user guide and ADR-0011 for
      the design rationale.
  - name: quality
    description: |
      Quality definitions (resolution, source, codec metadata) and profiles
      (named collections with cutoff/upgrade rules). See ADR-0005 for the design
      and Radarr compatibility rationale.
  - name: music
    description: Music album editions and audio-quality / metadata profiles.

  - name: discovery
    description: |
      Read-only provider details, Import List discovery tracking, and TMDB-backed
      library expansion and movie collection gaps. Growth routes require a
      user-backed identity, not an anonymous/shared configuration key.
  - name: collections
    description: |
      Persistent mixed movie/show collections, source reconciliation and explicit
      manual merges. Reads resolve merged IDs; writes through stale merged IDs
      return 409 and require reloading the canonical collection.
paths:
  /api/v1/collections/:
    get:
      tags: [collections]
      operationId: listCollections
      summary: List Loom-owned collections with current library membership.
      description: |
        Authenticated read, following existing library access. Movie/show,
        library and status filters are applied by the standalone client to
        member metadata. File status is computed on detail reads only.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Persistent collections. Membership does not imply monitoring or files.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LoomCollection" }
        "401": { description: Authentication required. }
        "500": { description: Collection storage or library read failed. }
    post:
      tags: [collections]
      operationId: createCollection
      summary: Create a local collection or import an exact provider source (admin).
      description: |
        Supply name/overview OR source, never both. A new source creates a
        separate Loom collection. An already-owned exact source returns its
        existing collection. Names and overlap never infer identity. Failed
        imports persist the source with a safe visible error and no fabricated
        members. IMDb uses the existing public-list adapter, not free datasets.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 300 }
                    overview: { type: string, maxLength: 20000 }
                - type: object
                  additionalProperties: false
                  required: [source]
                  properties:
                    source: { $ref: "#/components/schemas/CollectionSourceInput" }
      responses:
        "200":
          description: Created collection or current exact source owner, including source access errors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Invalid source or collection input. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "409": { description: Conflicting exact title identifiers. }
        "500": { description: Storage failed. }
        "504": { description: Request work budget expired; retry. }
  /api/v1/collections/discover:
    post:
      tags: [collections]
      operationId: discoverCollections
      summary: Queue an optional background library rescan (admin).
      description: |
        No provider requests occur in this HTTP request. The existing scheduler
        automatically discovers collections in persistent, fair movie/show
        batches across the full paginated library. This optional action resets
        the checkpoints for another scan. Provider errors retry automatically.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Current background scan progress after queueing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionScanStatus" }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "500": { description: Storage or library read failed. }
  /api/v1/collections/scan:
    get:
      tags: [collections]
      operationId: getCollectionScan
      summary: Get durable background discovery progress and retryable errors.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Per-title progress. Errors list the first ten issues; failed counts all issues.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionScanStatus" }
        "401": { description: Authentication required. }
        "500": { description: Scan status storage failed. }
  /api/v1/collections/{id}:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    get:
      tags: [collections]
      operationId: getCollection
      summary: Get collection members and live library/file state.
      description: |
        A merged stale ID resolves to the retained collection, returning its
        canonical id. Members include current and historical source provenance,
        local additions/exclusions and separate live acquisition/file status.
        No provider requests occur on reads.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Persistent collection and computed movie/show library state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "401": { description: Authentication required. }
        "404": { description: Unknown Loom collection ID. }
        "409": { description: Conflicting library title identity mapping. }
        "500": { description: Storage or file-state lookup failed. }
    patch:
      tags: [collections]
      operationId: editCollection
      summary: Edit local collection name/description/quality default (admin).
      description: |
        quality_profile_id is validated server-side and only applies to titles
        added from this collection; apply it to existing titles explicitly with
        POST /quality. An empty string clears the default.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, overview, revision]
              properties:
                name: { type: string, minLength: 1, maxLength: 300 }
                overview: { type: string, maxLength: 20000 }
                revision: { type: integer, minimum: 0 }
                quality_profile_id: { type: string }
      responses:
        "200":
          description: Updated collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Invalid input or missing revision. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "409": { description: Stale revision; reload before editing. }
        "500": { description: Storage failed. }
        "503": { description: Quality profiles unavailable during startup. }
    delete:
      tags: [collections]
      operationId: deleteCollection
      summary: Delete a collection without touching library titles or files (admin).
      description: |
        Removes only the collection, its source ownership, redirects and
        membership. Source references are durably suppressed so background
        discovery does not recreate the collection; importing the same source
        explicitly (POST / or POST /{id}/sources) clears the suppression.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  suppressed_sources: { type: integer }
        "400": { description: Missing revision. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "409": { description: Stale revision or a merged (redirected) ID. }
        "500": { description: Storage failed; nothing deleted. }
  /api/v1/collections/{id}/sources:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: attachCollectionSource
      summary: Attach and refresh another simultaneous collection source (admin).
      description: |
        Source identity is provider + kind + external ID. Multiple references
        per provider are allowed, up to 50 total. An already-owned reference
        on another collection returns 409; merge the collections explicitly.
        Source access errors are recorded on the source, preserving prior data.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionSourceInput" }
      responses:
        "200":
          description: Collection with source reconciliation outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Unsupported/invalid source or source limit exceeded. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "409": { description: Reference belongs elsewhere or collection changed concurrently. }
        "500": { description: Storage failed. }
  /api/v1/collections/{id}/refresh:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: refreshCollection
      summary: Retry/reconcile all attached sources, preserving local intent (admin).
      description: |
        90-second provider budget, no partial per-source commits. Failed sources
        retain previous members and expose safe retryable errors. Successful
        sources replace only their contribution. Local additions, title
        overrides and exclusions survive. Membership does not acquire media.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Collection with per-source last_sync and error outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Collection aggregate exceeds its 8 MiB limit. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "409": { description: Collection changed concurrently; reload and retry. }
        "500": { description: Storage failed. }
  /api/v1/collections/{id}/merge:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: mergeCollections
      summary: Merge another collection into this retained collection (admin).
      description: |
        Explicit user-confirmed merge. Transactionally reassigns source
        ownership, unions exact-ID movie/show members and provenance, preserves
        local additions/overrides and exclusions, and installs stable redirects.
        Exclusion wins if either input excludes a member. Destination local
        metadata wins over incoming metadata. No name/overlap inference.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from_id, revision, from_revision]
              properties:
                from_id: { type: string, format: uuid }
                revision: { type: integer, minimum: 0 }
                from_revision: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Retained collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Missing revisions, self-merge or aggregate limit exceeded. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: One collection does not exist. }
        "409": { description: Stale revisions or contradictory exact external IDs. }
        "500": { description: Transaction failed; no merge changes committed. }
  /api/v1/collections/{id}/members:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: addCollectionMember
      summary: Add real library or provider titles as local members (admin).
      description: |
        Each item is either an existing library title (media_type + media_id,
        resolved server-side to its provider IDs) or a provider search result
        (media_type, title and exact external_ids, enriched via TMDB when
        configured). Never creates library media. Exact IDs deduplicate;
        contradictory IDs return 409.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                revision: { type: integer, minimum: 0 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [media_type]
                    properties:
                      media_type: { type: string, enum: [movie, series] }
                      media_id: { type: string, description: Existing library title ID. }
                      title: { type: string, minLength: 1, maxLength: 500 }
                      year: { type: integer }
                      poster_path: { type: string }
                      external_ids: { $ref: "#/components/schemas/CollectionTitleIDs" }
      responses:
        "200":
          description: Collection with local members; existing exact IDs deduplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Unknown library title, missing IDs or invalid input. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "409": { description: Conflicting IDs or concurrent collection change. }
        "500": { description: Storage failed. }
  /api/v1/collections/{id}/members/{member}:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
      - name: member
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [collections]
      operationId: editCollectionMember
      summary: Exclude/restore a member or override its local title (admin).
      description: |
        Exclusion does not delete media or change monitoring. Local intent is
        retained through refresh and merge. At least one field is required.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                excluded: { type: boolean }
                title: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Collection with preserved local intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Invalid patch. }
        "401": { description: Authentication required. }
        "403": { description: Administrator required. }
        "404": { description: Collection/member not found. }
        "409": { description: Collection changed concurrently. }
        "500": { description: Storage failed. }
    delete:
      tags: [collections]
      operationId: removeCollectionMember
      summary: Remove a local member, or drop the local addition of a source member (admin).
      description: Source-only members must be excluded instead. Never deletes media.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Updated collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoomCollection" }
        "400": { description: Source-only member; exclude it instead. }
        "403": { description: Administrator required. }
        "404": { description: Collection/member not found. }
  /api/v1/collections/{id}/bulk/add:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: bulkAddCollectionMembers
      summary: Preview or start adding missing members to the library (admin).
      description: |
        execute=false returns per-member eligibility with skip reasons and the
        resolved shared settings (library, quality profile defaulting to the
        collection default, monitoring, search). execute=true starts a
        background job adding only eligible titles through the existing movie
        and show services; poll /jobs/{job}. Partial failures are per item.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CollectionSelection" }
                - type: object
                  properties:
                    execute: { type: boolean }
                    include_unreleased: { type: boolean }
                    movie: { $ref: "#/components/schemas/CollectionAddSettings" }
                    series: { $ref: "#/components/schemas/CollectionAddSettings" }
      responses:
        "200":
          description: Preview or started job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBulkPlan" }
        "400": { description: Invalid selection/library/profile, or nothing eligible to execute. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "503": { description: Library actions unavailable during startup. }
  /api/v1/collections/{id}/bulk/search:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: bulkSearchCollectionMembers
      summary: Preview or start automatic search for monitored missing members (admin).
      description: |
        Only library titles that are monitored and missing are eligible; shows
        search monitored aired missing episodes. Never adds titles. Concurrent
        searches for the same title are deduplicated.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CollectionSelection" }
                - type: object
                  properties:
                    execute: { type: boolean }
      responses:
        "200":
          description: Preview or started job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBulkPlan" }
        "400": { description: Invalid selection or nothing eligible to execute. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
        "503": { description: Search engine unavailable. }
  /api/v1/collections/{id}/quality:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    post:
      tags: [collections]
      operationId: applyCollectionQuality
      summary: Preview or explicitly apply a quality profile to existing member titles (admin).
      description: |
        Defaults to the collection's quality default. Only selected library
        titles change; other collections are unaffected.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CollectionSelection" }
                - type: object
                  properties:
                    execute: { type: boolean }
                    quality_profile_id: { type: string }
      responses:
        "200":
          description: Per-title current/new profile and outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionBulkPlan" }
        "400": { description: Invalid selection or profile. }
        "403": { description: Administrator required. }
        "404": { description: Collection not found. }
  /api/v1/collections/{id}/jobs:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
    get:
      tags: [collections]
      operationId: listCollectionJobs
      summary: Recent bulk add/search jobs for a collection.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CollectionJob" } }
  /api/v1/collections/{id}/jobs/{job}:
    parameters:
      - { $ref: "#/components/parameters/CollectionID" }
      - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [collections]
      operationId: getCollectionJob
      summary: Bulk job progress with per-item results.
      security: [{ cookieAuth: [] }, { apiKey: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Job snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionJob" }
        "404": { description: Unknown or expired job. }
  /api/v1/media-files/{mediaType}/{id}:
    parameters:
      - $ref: "#/components/parameters/TitleFileMediaType"
      - $ref: "#/components/parameters/TitleFileID"
      - $ref: "#/components/parameters/TitleFileSeason"
    get:
      tags: [libraries]
      operationId: listTitleFiles
      summary: List all regular files in a movie, show or season folder (admin).
      security:
        - cookieAuth: []
        - apiKey: []
        - bearerAuth: []
      description: |
        Requires administrator access when authentication is enabled. Resolves
        the title folder on the server. Includes untracked extras and subtitles,
        excluding directories, symlinks and special files. Ambiguous/shared
        folders and loose files at the library root are rejected.
      responses:
        "200":
          description: Title-relative files and the policy the user must confirm.
          content:
            application/json:
              schema:
                type: object
                required: [files, deletionMode]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/TitleFile"
                  deletionMode:
                    type: string
                    enum: [recycle, permanent]
        "400":
          description: Invalid media type or season query.
        "401":
          description: Authentication required.
        "403":
          description: Administrator access required.
        "404":
          description: Title, season or folder not found.
        "409":
          description: Folder cannot be safely or unambiguously resolved.
        "500":
          description: Disk or database listing failed.
  /api/v1/media-files/{mediaType}/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/TitleFileMediaType"
      - $ref: "#/components/parameters/TitleFileID"
      - $ref: "#/components/parameters/TitleFileSeason"
    post:
      tags: [libraries]
      operationId: deleteTitleFiles
      summary: Remove explicitly confirmed title-relative files (admin).
      security:
        - cookieAuth: []
        - apiKey: []
        - bearerAuth: []
      description: |
        Requires administrator access when authentication is enabled. Clients
        must display every selected path and the listing's deletionMode in an
        explicit confirmation dialog. Rejects stale deletion policy rather
        than silently changing recycle to permanent deletion. A configured
        recycle bin uses rooted copy/remove with no permanent-delete fallback.
        Prevalidates the entire selection; runtime failures may leave an explicit
        partial result. Every removed file is audited and reconciled with movie,
        episode, library inventory and current request availability. Historical
        request fulfillment is preserved. Directories/symlinks cannot be deleted.
      parameters:
        - name: X-Confirm-Delete
          in: header
          required: true
          schema:
            type: string
            const: "true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paths, deletionMode]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  uniqueItems: true
                  items:
                    type: string
                  description: Exact relative paths from the current listing; never an absolute root.
                deletionMode:
                  type: string
                  enum: [recycle, permanent]
      responses:
        "200":
          description: Files successfully removed and reconciled.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid selection, JSON, scope, path, or missing confirmation header; nothing deleted.
        "401":
          description: Authentication required.
        "403":
          description: Administrator access required.
        "404":
          description: Title, season or folder not found.
        "409":
          description: Unsafe/ambiguous folder or changed deletion policy; reload and confirm again.
        "500":
          description: |
            Removal or reconciliation failed. Already deleted files are not
            rolled back. Refresh the listing before retrying.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, error]
                properties:
                  deleted:
                    type: array
                    items:
                      type: string
                  error:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
  /api/v1/autosearch/evaluate:
    post:
      tags: [quality]
      summary: Explain release decisions with the production engine without grabbing.
      operationId: evaluateReleases
      security:
        - cookieAuth: []
        - apiKey: []
        - bearerAuth: []
      description: |
        Evaluates supplied indexer results with the same identity, policy and
        ranking path used by acquisition. Optional policy_preview replaces only
        the quality profile for this request; it never saves or grabs. Existing
        library state, quality definitions and loaded format rules still apply.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                media_type: { type: string, enum: [movie, series, episode] }
                media_id: { type: string }
                title: { type: string }
                alternate_titles:
                  type: array
                  items: { type: string }
                year: { type: integer }
                quality_profile_id: { type: string }
                imdb_id: { type: string }
                tmdb_id: { type: string }
                tvdb_id: { type: string }
                season: { type: integer }
                episode: { type: integer }
                daily_date: { type: string, format: date }
                runtime: { type: integer, description: Minutes used by per-minute size limits. }
                ignore_blocklist: { type: boolean, description: Evaluate blocklisted releases instead of rejecting them. }
                policy_preview:
                  type: object
                  required: [items]
                  properties:
                    items:
                      type: string
                      description: JSON-encoded array of quality items; non-empty unique IDs, allowed boolean, ordered best first.
                      example: '[{"id":"bluray-1080p","allowed":true}]'
                    cutoff: { type: string }
                    upgrade_allowed: { type: boolean }
                    min_format_score: { type: integer, description: Points. }
                    cutoff_format_score:
                      type: integer
                      description: Retained profile field; current acquisition does not use it as a rejection gate.
                    format_items:
                      type: array
                      items:
                        type: object
                        required: [format_id, score]
                        properties:
                          format_id: { type: string }
                          score: { type: integer, description: Profile-specific points. }
                results:
                  type: array
                  items:
                    type: object
                    required: [title]
                    properties:
                      indexer_id: { type: string }
                      title: { type: string }
                      link: { type: string }
                      size: { type: integer, format: int64, description: Bytes; 0 is unknown. }
                      pub_date: { type: string, format: date-time }
                      seeders: { type: integer, description: Omit for Usenet. }
                      freeleech: { type: boolean }
      responses:
        "200":
          description: Accepted results ranked by engine keys, followed by rejected results.
          content:
            application/json:
              schema:
                type: object
                required: [preview, total, passed, results]
                properties:
                  preview: { type: boolean }
                  total: { type: integer }
                  passed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        indexer_id: { type: string }
                        rejected: { type: boolean }
                        reject_reason: { type: string }
                        quality_name: { type: string }
                        quality_tier: { type: integer, description: Zero-based position; lower is better; -1 means not selected. }
                        format_score: { type: integer, description: Profile-specific points. }
                        composite_score: { type: number, description: Display only; never the ordering comparator. }
                        explanation:
                          type: object
                          properties:
                            category:
                              type: string
                              enum: [accepted, incorrect_identity, ambiguous_identity, unsupported_naming, configuration_mismatch, availability]
                            summary: { type: string }
                            identity:
                              type: array
                              items: { $ref: "#/components/schemas/DecisionEvidence" }
                            checks:
                              type: array
                              items: { $ref: "#/components/schemas/DecisionEvidence" }
                            numbering:
                              type: object
                              properties:
                                season: { type: integer }
                                episode: { type: integer }
                                episodes:
                                  type: array
                                  items: { type: integer }
                                absolute_episode: { type: integer }
                                season_pack: { type: boolean }
                                daily_date: { type: string }
                                pack_mapping: { type: string, description: Discovery-only limitation; never a correction. }
                            contributions:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string }
                                  name: { type: string }
                                  score: { type: integer, description: Actual points added from this profile. }
                            rank: { type: integer, description: One-based accepted rank. }
                            ranking_reason: { type: string, description: First differing comparator key vs adjacent accepted candidate. }
        "400":
          description: Invalid JSON or malformed preview quality items.
        "500":
          description: Identity lookup, saved profile or evaluation dependency failed.
  /api/v1/requests:
    post:
      tags: [requests]
      operationId: createMediaRequest
      summary: Submit a new request or an explicit confirmed-missing re-request.
      description: |
        Requires authentication. With re_request_of, the caller must own the
        fulfilled request or be an administrator; media_type and tmdb_id must
        match its history. Storage is rechecked before admitting the request.
        Only confirmed missing media can be re-requested; unknown and present
        observations block admission. One global active request is allowed per
        media identity. Each re-request consumes a new rolling quota slot;
        historical fulfillment still counts in its original window. Admins
        bypass quotas, not duplicates or storage checks.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_type, tmdb_id]
              properties:
                media_type: { type: string, enum: [movie, series, artist] }
                tmdb_id: { type: string, description: "TMDB ID, or MusicBrainz ID for artists." }
                title: { type: string }
                year: { type: integer }
                poster_path: { type: string }
                overview: { type: string }
                re_request_of: { type: string, description: "Original fulfilled request ID; never resets that history." }
      responses:
        "201":
          description: Pending request created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaRequest" }
        "400": { description: Invalid request. }
        "401": { description: Authentication required. }
        "403": { description: Re-request targets another user's history. }
        "409": { description: Active duplicate, present or unknown availability, or invalid history link. }
        "429": { description: Rolling per-user quota exceeded. }
    get:
      tags: [requests]
      operationId: listMediaRequests
      summary: List all request history (administrator only).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Request history with independent current observations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MediaRequest" }
        "403": { description: Administrator access required. }
  /api/v1/requests/mine:
    get:
      tags: [requests]
      operationId: listMyMediaRequests
      summary: List the authenticated user's request history.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Own requests; observations older than five minutes are unknown.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MediaRequest" }
        "401": { description: Authentication required. }
  /api/v1/requests/reconcile:
    post:
      tags: [requests]
      operationId: reconcileRequestAvailability
      summary: Preview or apply audited, non-destructive availability reconciliation.
      description: |
        Administrator only. Each approved/fulfilled request receives an
        independent outcome. No media or import records are deleted. Dry runs
        persist an audit but do not modify requests, storage anchors or files.
        Applied runs may register a storage marker only after physically
        verifying an imported file on that volume. Missing/wrong markers,
        inaccessible volumes, nested mounts and incomplete scan evidence yield
        unknown, never bulk deletion. Applying the same observation preserves
        fulfilled_at and updated_at; availability_checked_at is refreshed.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dry_run]
              properties:
                dry_run: { type: boolean }
      responses:
        "200":
          description: Batch audit with per-item observations and errors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestReconciliation" }
        "400": { description: Explicit dry_run boolean required. }
        "403": { description: Administrator access required. }
        "500": { description: Batch persistence failed; request updates rolled back. }
  /api/v1/requests/reconciliation:
    get:
      tags: [requests]
      operationId: listRequestReconciliations
      summary: Return the latest 50 reconciliation audits (administrator only).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Latest batches including previews and automatic state changes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RequestReconciliation" }
        "403": { description: Administrator access required. }
  /api/v1/blocklist/check:
    post:
      tags: [download-clients]
      summary: Report which candidate releases are blocklisted.
      description: |
        Matches each release by info hash (explicit or parsed from the magnet)
        and by normalized title. Results are positional. At most 2000 releases.
      operationId: checkBlocklist
      security:
        - apiKey: []
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releases]
              properties:
                releases:
                  type: array
                  maxItems: 2000
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      infohash: { type: string }
                      magnet: { type: string }
      responses:
        "200":
          description: One flag per submitted release, in order.
          content:
            application/json:
              schema:
                type: object
                required: [blocked]
                properties:
                  blocked:
                    type: array
                    items: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/downloads/history:
    get:
      tags: [download-clients]
      summary: List download completion and durable acquisition history.
      operationId: listDownloadHistory
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: History ordered newest first. Acquisition rows include sanitized reasons and persistent retry decisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, status, completed_at, retry_eligible]
                  properties:
                    id: { type: string }
                    download_id: { type: string }
                    client_id: { type: string }
                    title: { type: string }
                    category: { type: string }
                    status: { type: string, description: "completed, failed, acquiring, acquisition_failed or acquired" }
                    grabbed_at: { type: string, format: date-time }
                    completed_at: { type: string, format: date-time }
                    acquisition_key: { type: string }
                    media_type: { type: string }
                    media_id: { type: string }
                    indexer_id: { type: string }
                    release_hash: { type: string }
                    stage: { type: string, enum: [admission, validation, provider, provider_search, client] }
                    reason: { type: string }
                    attempt: { type: integer }
                    retry_count: { type: integer }
                    retry_eligible: { type: boolean }
                    is_latest: { type: boolean }
                    next_retry_at: { type: string, format: date-time }
        "500":
          description: History storage failed.
    delete:
      tags: [download-clients]
      summary: Clear completion history, retaining acquisition retry records.
      operationId: clearDownloadHistory
      responses:
        "204":
          description: Completion history cleared.
        "403":
          description: Administrator access required.
  /api/v1/downloads/history/actions:
    post:
      tags: [download-clients]
      summary: Authorize retry or blocklist latest failed/interrupted acquisitions.
      description: Requires an administrator identity. Retry resets the budget for a future fresh search; it never replays stored URLs or removes a blocklist entry.
      operationId: acquisitionHistoryActions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                action: { type: string, enum: [retry, blocklist] }
      responses:
        "200":
          description: Per-item outcomes, including partial failure.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        "400":
          description: Invalid action or batch size.
        "403":
          description: Administrator identity required.
        "503":
          description: Download history is unavailable.

