name: Synology package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Loom release tag to package (for example v0.4.1)
        required: true
        type: string
      target:
        description: Synology architecture and DSM target
        required: true
        default: arch-x64-7.1
        type: choice
        options:
          - arch-x64-7.1
          - arch-aarch64-7.1

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target || 'arch-x64-7.1' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      SPK_TARGET: ${{ inputs.target || 'arch-x64-7.1' }}
    steps:
      - name: Checkout Loom package recipe
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: SynoCommunity/spksrc
          path: spksrc
          fetch-depth: 1
      - name: Validate release and target
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^PKG_VERS = //p' packaging/synology/cross/loom/Makefile)"
          spk_version="$(sed -n 's/^SPK_VERS = //p' packaging/synology/spk/loom/Makefile)"
          package_tag="v${package_version}"
          if [ "$package_version" != "$spk_version" ]; then
            echo "Cross-package version ${package_version} does not match package version ${spk_version}" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "$package_tag" ]; then
            echo "Recipe version ${package_version} does not match release ${RELEASE_TAG}" >&2
            exit 1
          fi
          case "$SPK_TARGET" in
            arch-x64-7.1|arch-aarch64-7.1) ;;
            *) echo "Unsupported Synology target: ${SPK_TARGET}" >&2; exit 1 ;;
          esac
      - name: Install Loom package recipe
        run: |
          cp -R packaging/synology/cross/loom/. spksrc/cross/loom/
          cp -R packaging/synology/spk/loom/. spksrc/spk/loom/
      - name: Build package
        run: |
          docker run --rm --platform=linux/amd64 \
            -e 'TAR_CMD=fakeroot tar' \
            -e SPK_TARGET \
            -v "$GITHUB_WORKSPACE/spksrc:/spksrc" \
            -w /spksrc \
            ghcr.io/synocommunity/spksrc \
            bash -lc 'make -C spk/loom "$SPK_TARGET"'
      - name: Record build inputs
        run: |
          set -euo pipefail
          package="$(find spksrc/packages -maxdepth 1 -type f -name 'loom_*.spk' -print -quit)"
          if [ -z "$package" ]; then
            echo "Synology package build produced no .spk file" >&2
            exit 1
          fi
          {
            echo "Loom release: ${RELEASE_TAG}"
            echo "Target: ${SPK_TARGET}"
            echo "Source SHA-256: $(awk '$2 == "SHA256" {print $3}' packaging/synology/cross/loom/digests)"
            echo "spksrc commit: $(git -C spksrc rev-parse HEAD)"
            echo "Builder image: $(docker image inspect --format='{{index .RepoDigests 0}}' ghcr.io/synocommunity/spksrc)"
            echo "Package SHA-256: $(sha256sum "$package" | cut -d ' ' -f 1)"
          } | tee spksrc/packages/loom-build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: synology-${{ env.RELEASE_TAG }}-${{ env.SPK_TARGET }}
          path: |
            spksrc/packages/loom_*.spk
            spksrc/packages/loom-build-info.txt
          if-no-files-found: error
          retention-days: 30
