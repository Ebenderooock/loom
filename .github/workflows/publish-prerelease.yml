name: Publish prerelease image

on:
  push:
    branches: ["prelease/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/prelease/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Compute isolated channel and build metadata
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${BRANCH#prelease/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected prelease/<major>.<minor>.<patch>, got $BRANCH"
            exit 1
          fi
          channel="prelease-${version}"
          short_sha=$(git rev-parse --short HEAD)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "tag=${channel}-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "version=${version}-pre.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push prerelease only
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ebenderooock/loom:${{ steps.meta.outputs.channel }}
            ghcr.io/ebenderooock/loom:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            TVDB_APIKEY=${{ secrets.TVDB_APIKEY }}
            GOMAXPROCS=2
      - name: Summary
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "Channel: \`ghcr.io/ebenderooock/loom:${CHANNEL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned build: \`ghcr.io/ebenderooock/loom:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "No stable/main tags or deployments were changed. Deploy explicitly to an isolated test instance." >> "$GITHUB_STEP_SUMMARY"
