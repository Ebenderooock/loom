name: Publish prerelease image

on:
  push:
    branches: ["prelease/**", "prerelease/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: publish-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository == 'Ebenderooock/loom' &&
      (startsWith(github.ref, 'refs/heads/prelease/') ||
       startsWith(github.ref, 'refs/heads/prerelease/'))
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wait for the trusted publisher
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          PUBLISHER_APP_SLUG: ${{ vars.PUBLISHER_APP_SLUG }}
        run: python3 scripts/wait-for-publisher.py
