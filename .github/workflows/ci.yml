name: ci

on:
  push:
    branches: [main, "prelease/**", "prerelease/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "prelease/**", "prerelease/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_code_changes.py

  publishing-observer:
    name: Publishing observer
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  go-race:
    name: Go race (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        # PRs and main pushes validate all platforms before release tagging.
        # Release tags (v*) retain the same full matrix; ordinary prerelease
        # branch pushes use hosted Linux only. All runners are public hosted.
        #
        # Self-hosted runners are intentionally NOT used here: this workflow runs
        # on `pull_request`, so a self-hosted runner would execute untrusted code
        # from forked PRs on private infrastructure.
        os: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        shard: [0, 1, 2, 3]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: false
      - name: Locate Go caches
        id: cache
        shell: bash
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.cache.outputs.modules }}
            ${{ steps.cache.outputs.build }}
          key: go-ci-v1-${{ runner.os }}-${{ runner.arch }}-1.26.11-race-disable-libutp-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-ci-v1-${{ runner.os }}-${{ runner.arch }}-1.26.11-race-disable-libutp-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}-
      # The race detector requires cgo + a C toolchain. GitHub-hosted runners
      # ship gcc, but the guard keeps this resilient if gcc is ever missing. The
      # disable_libutp tag drops the transitive go-libutp C++ dependency (which
      # the CGO_ENABLED=0 production build excludes anyway), so only gcc — not
      # g++ — is needed.
      - name: Ensure C compiler (for -race)
        if: runner.os == 'Linux'
        run: command -v gcc >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y gcc; }
      # Run most packages with race detector. The workflows package contains
      # async state-machine tests that poll goroutine-driven state transitions;
      # they are inherently timing-sensitive and produce false timeouts under
      # -race on loaded runners, so they are run without -race separately.
      - name: Run tests (with race detector)
        shell: bash
        # "python" is on PATH on all three hosted OSes, including Windows.
        run: python -B scripts/go-ci.py test --shards 4 --shard ${{ matrix.shard }} --coverage coverage-${{ matrix.shard }}.out
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          if-no-files-found: error

  go-checks:
    name: Go vet and workflows (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: false
      - name: Locate Go caches
        id: cache
        shell: bash
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.cache.outputs.modules }}
            ${{ steps.cache.outputs.build }}
          key: go-ci-v1-${{ runner.os }}-${{ runner.arch }}-1.26.11-vet-workflows-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-ci-v1-${{ runner.os }}-${{ runner.arch }}-1.26.11-vet-workflows-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: go vet ./...
      - name: Run workflows tests (without race detector)
        run: go test -tags disable_libutp -count=1 -timeout 120s ./internal/workflows/...
        env:
          CGO_ENABLED: "0"

  go-coverage:
    name: Go coverage
    runs-on: ubuntu-latest
    needs: [changes, go-race]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true
      - name: Merge race coverage
        run: python3 -B scripts/go-ci.py merge --shards 4 --directory coverage-shards
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  go:
    name: Go (${{ matrix.os }})
    runs-on: ubuntu-latest
    needs: [changes, go-race, go-checks, go-coverage]
    if: always() && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Require all Go prerequisites to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["NEEDS"])
          expected = {"changes", "go-race", "go-checks", "go-coverage"}
          if set(results) != expected or any(job["result"] != "success" for job in results.values()):
              raise SystemExit(f"Go prerequisites did not all succeed: {results}")
          PY

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      # golangci-lint's published binaries are built with an older Go that
      # refuses our go1.26.11 target ("Go language version used to build
      # golangci-lint is lower than the targeted Go version"), so build it from
      # source with the toolchain selected above. Only issues NEW relative to
      # the default branch fail CI; the existing backlog is grandfathered and
      # tracked for gradual cleanup.
      - name: Install golangci-lint (built with go1.26.11)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      # Grandfather the existing backlog: only issues NEW relative to the base
      # fail CI. For PRs that's the merge-base with the target branch; for
      # direct pushes it's the commit range that was pushed (so direct-to-main
      # pushes still catch regressions); tag/initial pushes fall back to the
      # default branch.
      - name: Run golangci-lint (new issues only)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "+${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            golangci-lint run --new-from-merge-base="origin/${BASE_REF}" ./...
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            golangci-lint run --new-from-rev="${BEFORE}" ./...
          else
            git fetch --no-tags origin "+${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            golangci-lint run --new-from-merge-base="origin/${DEFAULT_BRANCH}" ./...
          fi

  vuln:
    name: govulncheck
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Package-level scan flags vulnerable imported packages quickly; standard
      # library advisories are covered by tracking the latest go1.26 patch (currently 1.26.11) above.
      - run: govulncheck -scan package ./...

  build:
    name: Build matrix
    runs-on: ubuntu-latest
    needs: [changes, go, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm, goarm: "7" }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - run: go build -trimpath -ldflags="-s -w" -o /tmp/loom ./cmd/loom

  installers:
    name: Windows service installer
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - name: Test native service lifecycle and installer
        shell: pwsh
        run: |
          go test ./cmd/loom ./internal/updater ./internal/updates
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          go test -tags loom_updater_windows_candidate ./internal/updater
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate boundary tests failed' }
          foreach ($script in @('packaging/windows/install.ps1', 'packaging/windows/uninstall.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw "Invalid PowerShell: $script $errors" }
          }
          go build -tags loom_updater_windows_candidate -o .\loom-updater-candidate.exe ./cmd/loom-updater
          if ($LASTEXITCODE -ne 0) { throw 'Candidate helper build failed' }
          # Deliberately do NOT enroll unvalidated privileged candidate code.
          # Native SCM/NTFS failure/reboot acceptance is a separate release gate.
          go build -o .\loom-test.exe ./cmd/loom
          if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
          & .\packaging\windows\smoke-test.ps1 -BinaryPath .\loom-test.exe

  macos-updater:
    name: macOS updater boundary tests (unprivileged)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - run: go test -short ./internal/updater ./internal/updates
      - run: go build ./cmd/loom-updater
      - run: plutil -lint packaging/macos/dev.loom.server.plist packaging/macos/dev.loom.updater.plist

  web:
    name: Frontend
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
