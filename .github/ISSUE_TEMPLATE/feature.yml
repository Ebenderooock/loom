name: Feature request
description: Request a feature or enhancement
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Have a concrete feature or enhancement in mind? Describe it below after checking existing issues.
        For general questions and setup help, use
        [Q&A Discussions](https://github.com/Ebenderooock/loom/discussions/categories/q-a).
        To brainstorm an idea before proposing work, start an
        [Ideas discussion](https://github.com/Ebenderooock/loom/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch of the solution.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
